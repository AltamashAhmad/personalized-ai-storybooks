  <path d="M51 44C45 42 38 43 33 47C33 41 40 37 50 38L51 44Z" fill="#FFFFFF" fill-opacity="0.95" />
  <path d="M32 40V49" stroke="#E5A93C" stroke-width="1.5" stroke-linecap="round" />
