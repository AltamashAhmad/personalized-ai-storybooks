<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PersonalizedTales logo">
  <title>PersonalizedTales — Personalized Children&apos;s Storybooks</title>
  <defs>
    <linearGradient id="ptGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5751" />
      <stop offset="100%" stop-color="#133834" />
    </linearGradient>
    <linearGradient id="ptGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="ptGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1E5751" flood-opacity="0.25" />
